# =====================================================================
# ERIS - Local Vector Database Container (pgvector)
# =====================================================================
# Runs PostgreSQL 17 with the pgvector C-extension pre-installed.
# Bound strictly to 127.0.0.1:5432 to prevent network exposure.
# =====================================================================

services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: eris-pgvector
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-eris_db}
    volumes:
      - eris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-eris_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  eris_pgdata:
    name: eris_pgdata
