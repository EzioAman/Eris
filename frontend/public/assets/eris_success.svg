<svg id="eris" viewBox="20 -16 722 722" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Eris logo - Success" style="--spring: linear(0.000,0.038,0.140,0.284,0.452,0.625,0.791,0.938,1.059,1.150,1.212,1.245,1.254,1.241,1.214,1.176,1.133,1.089,1.048,1.011,0.982,0.959,0.945,0.937,0.936,0.939,0.947,0.957,0.968,0.979,0.989,0.998,1.006,1.011,1.014,1.016,1.016,1.015,1.013,1.011,1.008,1.005,1.002,1.000,0.998,1);" data-state="success">
    <defs>
      <linearGradient id="arcL" x1="0.9" y1="0" x2="0.1" y2="1">
        <stop offset="0" stop-color="#fff4dc"></stop><stop offset="0.5" stop-color="#b9a98f"></stop><stop offset="1" stop-color="#e8d9bd"></stop>
      </linearGradient>
      <linearGradient id="arcR" x1="0.5" y1="0" x2="0.5" y2="1">
        <stop offset="0" stop-color="#8f8168"></stop><stop offset="0.55" stop-color="#fff4dc"></stop><stop offset="1" stop-color="#d8c8a9"></stop>
      </linearGradient>
      <radialGradient id="core" cx="381" cy="345" r="90" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fffaf0"></stop><stop offset="0.35" stop-color="#ffe9c2" stop-opacity="0.7"></stop><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"></stop>
      </radialGradient>
      <linearGradient id="tail" gradientUnits="userSpaceOnUse" x1="381" y1="19" x2="131" y2="135">
        <stop offset="0" stop-color="#fff1d0" stop-opacity="0.95"></stop><stop offset="1" stop-color="#fff1d0" stop-opacity="0"></stop>
      </linearGradient>
      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="6" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
      </filter>
    </defs>

    <style>
      #eris { --spring: cubic-bezier(.34,1.56,.64,1); transition: filter .6s ease, opacity .6s ease; }
      #eris .l, #eris .r, #eris .star, #eris .core, #eris .hr, #eris .orb, #eris .burst { transform-origin: 381px 345px; }
      #eris .dot, #eris .tw, #eris .od { transform-box: fill-box; transform-origin: center; }
      #eris .burst { opacity: 0; }
      #eris .trail { opacity: 0; transition: opacity .5s; }

      /* ===== SUCCESS ===== */
      #eris[data-state="success"] .l     { animation: snapL 1.4s var(--spring) both; }
      #eris[data-state="success"] .r     { animation: snapR 1.4s var(--spring) both; }
      #eris[data-state="success"] .orb   { animation: whip 1.6s var(--spring) both; }
      #eris[data-state="success"] .star  { animation: burst 1.2s ease-out both; }
      #eris[data-state="success"] .core  { animation: coreFlash 1.4s ease-out both; }
      #eris[data-state="success"] .burst { animation: ring 1.4s ease-out both; }
      #eris[data-state="success"] .dot   { animation: blink .8s ease-out 1 both; }

      .tw { animation: twinkle 3s ease-in-out infinite; }

      @keyframes blink { 0%,100%{opacity:.35;scale:.8} 30%{opacity:1;scale:1.25} 60%{opacity:.5;scale:.9} }
      @keyframes twinkle { 0%,100%{opacity:.2;scale:.7} 50%{opacity:1;scale:1.4} }
      @keyframes snapL { 0%{rotate:-40deg} 100%{rotate:0deg} }
      @keyframes snapR { 0%{rotate:40deg} 100%{rotate:0deg} }
      @keyframes whip  { 0%{rotate:0deg} 100%{rotate:360deg} }
      @keyframes burst { 0%{scale:.7} 35%{scale:1.5} 100%{scale:1} }
      @keyframes coreFlash { 0%{scale:.8;opacity:.6} 30%{scale:3;opacity:1} 100%{scale:1;opacity:.85} }
      @keyframes ring { 0%{opacity:.9;scale:.2} 100%{opacity:0;scale:5} }
      @media (prefers-reduced-motion: reduce) { #eris * { animation: none !important; } }
    </style>

    <!-- thin outer ring -->
    <circle class="hr" cx="381" cy="345" r="326" fill="none" stroke="#e6d5b3" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="1.5 6"></circle>

    <!-- orbiting bright dots with comet trails -->
    <g class="orb">
      <g transform="rotate(-34.6 381 345)">
        <path class="trail" d="M131.3 135.5 A326 326 0 0 1 381 19" fill="none" stroke="url(#tail)" stroke-width="4" stroke-linecap="round"></path>
        <circle class="od" cx="381" cy="19" r="7" fill="#fff6e0" filter="url(#glow)"></circle>
      </g>
      <g transform="rotate(136.4 381 345)">
        <path class="trail" d="M131.3 135.5 A326 326 0 0 1 381 19" fill="none" stroke="url(#tail)" stroke-width="4" stroke-linecap="round"></path>
        <circle class="od" cx="381" cy="19" r="7" fill="#fff6e0" filter="url(#glow)"></circle>
      </g>
    </g>

    <!-- tiny sparkles -->
    <g fill="#ffe9c2">
      <circle class="tw" cx="395" cy="4" r="1.6" style="animation-delay:0s"></circle>
      <circle class="tw" cx="437" cy="41" r="1.6" style="animation-delay:.6s"></circle>
      <circle class="tw" cx="573" cy="71" r="2" style="animation-delay:1.1s"></circle>
      <circle class="tw" cx="650" cy="182" r="1.8" style="animation-delay:1.7s"></circle>
      <circle class="tw" cx="41" cy="341" r="2.2" style="animation-delay:.3s"></circle>
      <circle class="tw" cx="105" cy="512" r="1.6" style="animation-delay:2s"></circle>
      <circle class="tw" cx="72" cy="496" r="1.4" style="animation-delay:1.4s"></circle>
      <circle class="tw" cx="348" cy="663" r="2" style="animation-delay:.9s"></circle>
      <circle class="tw" cx="690" cy="255" r="1.5" style="animation-delay:2.4s"></circle>
    </g>

    <!-- crescents: true circular arcs -->
    <g class="l"><path filter="url(#glow)" fill="url(#arcL)" d="M485 102 A275 275 0 1 0 346 620 A270 270 0 1 1 485 102 Z"></path></g>
    <g class="r"><path filter="url(#glow)" fill="url(#arcR)" d="M533 115 A277 277 0 0 1 407 620.5 A296 296 0 0 0 533 115 Z"></path></g>

    <circle class="burst" cx="381" cy="345" r="60" fill="none" stroke="#ffe9c2" stroke-width="4"></circle>
    <circle class="core" cx="381" cy="345" r="90" fill="url(#core)"></circle>
    <path class="star" filter="url(#glow)" fill="#fff6e3" d="M381 207 C 384 285, 400 338, 572 345 C 400 352, 384 405, 381 487 C 378 405, 362 352, 188 345 C 362 338, 378 285, 381 207 Z"></path>

    <g fill="#f6ead2" filter="url(#glow)">
      <circle class="dot d1" cx="382" cy="133" r="8" style="--dy:212px"></circle>
      <circle class="dot d2" cx="382" cy="181" r="7" style="--dy:164px"></circle>
      <circle class="dot d3" cx="382" cy="511" r="8" style="--dy:-166px"></circle>
      <circle class="dot d4" cx="382" cy="558" r="9" style="--dy:-213px"></circle>
    </g>
  </svg>
