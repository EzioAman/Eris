<svg id="coder" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Eris Code agent" data-state="working">
    <defs>
      <linearGradient id="cGold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff8e8"></stop><stop offset=".5" stop-color="#e8d9bd"></stop><stop offset="1" stop-color="#a48d69"></stop>
      </linearGradient>
      <radialGradient id="cCore" cx="256" cy="256" r="120" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fffaf0"></stop><stop offset=".35" stop-color="#ffe9c2" stop-opacity=".7"></stop><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"></stop>
      </radialGradient>
      <linearGradient id="cTail" gradientUnits="userSpaceOnUse" x1="256" y1="51" x2="138" y2="88">
        <stop offset="0" stop-color="#fff1d0" stop-opacity=".95"></stop><stop offset="1" stop-color="#fff1d0" stop-opacity="0"></stop>
      </linearGradient>
      <filter id="cGlow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="5" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
      </filter>
    </defs>

    <style>
      #coder { --spring: cubic-bezier(.34,1.56,.64,1); transition: filter .6s ease, opacity .6s ease; }
      @supports (animation-timing-function: linear(0,1)) {
        #coder { --spring: linear(0,.173,.539,.903,1.151,1.25,1.229,1.144,1.048,.975,.94,.938,.957,.982,1.002,1.014,1.016,1.0125,1.006,1.001,1); }
      }
      #coder .ring, #coder .orbit, #coder .core, #coder .burst { transform-box: view-box; transform-origin: 256px 256px; }
      #coder .emblem { transform-box: view-box; transform-origin: 256px 230px; }
      #coder .fx { transform-box: fill-box; transform-origin: center; }

      #coder .spark { animation: twinkle 3s ease-in-out infinite; }
      #coder .burst, #coder .check { opacity: 0; }
      #coder .trail { opacity: .8; transition: opacity .5s; }
      #coder .ln, #coder .check { stroke-dasharray: 100; stroke-dashoffset: 0; }
      #coder .ln { opacity: .5; }
      #coder .cursor { animation: caret 1.1s steps(1) infinite; }

      /* IDLE – brackets breathe apart and together with springs, slash tilts, caret blinks */
      #coder[data-state="idle"] .ring   { animation: spin 90s linear infinite; }
      #coder[data-state="idle"] .orbit  { animation: spin 60s linear infinite; }
      #coder[data-state="idle"] .trail  { opacity: .7; }
      #coder[data-state="idle"] .core   { animation: breathe 5s var(--spring) infinite; }
      #coder[data-state="idle"] .emblem { animation: floatY 6s ease-in-out infinite; }
      #coder[data-state="idle"] .bl     { animation: idleL 8s infinite; }
      #coder[data-state="idle"] .br     { animation: idleR 8s infinite; }
      #coder[data-state="idle"] .sl     { animation: idleS 8s .3s infinite; }
      #coder[data-state="idle"] .dot    { animation: blink 3.2s ease-in-out infinite; }

      /* THINKING – brackets squeeze, slash swings like a pendulum, lines shimmer, comet orbits */
      #coder[data-state="thinking"] .ring   { animation: spin 30s linear infinite reverse; }
      #coder[data-state="thinking"] .orbit  { animation: spin 5s linear infinite; }
      #coder[data-state="thinking"] .trail  { opacity: 1; }
      #coder[data-state="thinking"] .core   { animation: pulse 1.8s ease-in-out infinite; }
      #coder[data-state="thinking"] .bl     { animation: squeezeL 3.2s infinite; }
      #coder[data-state="thinking"] .br     { animation: squeezeR 3.2s infinite; }
      #coder[data-state="thinking"] .sl     { animation: swing 3.2s infinite; }
      #coder[data-state="thinking"] .ln     { animation: shimmer 1.8s ease-in-out infinite; }
      #coder[data-state="thinking"] .ln2    { animation-delay: .25s; }
      #coder[data-state="thinking"] .ln3    { animation-delay: .5s; }
      #coder[data-state="thinking"] .cursor { animation-duration: .55s; }
      #coder[data-state="thinking"] .dot    { animation: blink 1.2s ease-in-out infinite; }
      #coder[data-state="thinking"] .spark  { animation-duration: 1.2s; }

      /* WORKING – types three lines, caret hops with an elastic carriage return, brackets pop */
      #coder[data-state="working"] .ring   { animation: spin 14s linear infinite; }
      #coder[data-state="working"] .orbit  { animation: spin 3s linear infinite; }
      #coder[data-state="working"] .trail  { opacity: .8; }
      #coder[data-state="working"] .core   { animation: pulse .9s ease-in-out infinite; }
      #coder[data-state="working"] .ln1    { animation: inkA 4s linear infinite; }
      #coder[data-state="working"] .ln2    { animation: inkB 4s linear infinite; }
      #coder[data-state="working"] .ln3    { animation: inkC 4s linear infinite; }
      #coder[data-state="working"] .cursor { animation: type 4s infinite; }
      #coder[data-state="working"] .bl, #coder[data-state="working"] .br, #coder[data-state="working"] .sl { animation: bump 4s infinite; }
      #coder[data-state="working"] .dot    { animation: blink .8s ease-in-out infinite; }

      /* SUCCESS – brackets snap shut, lines light up, checkmark draws, orbit whips once */
      #coder[data-state="success"] .bl     { animation: closeL 1.4s var(--spring) both; }
      #coder[data-state="success"] .br     { animation: closeR 1.4s var(--spring) both; }
      #coder[data-state="success"] .sl     { animation: closeS 1.4s var(--spring) both; }
      #coder[data-state="success"] .orbit  { animation: whip 1.6s var(--spring) both; }
      #coder[data-state="success"] .trail  { opacity: .95; }
      #coder[data-state="success"] .core   { animation: flash 1.4s ease-out both; }
      #coder[data-state="success"] .burst  { animation: ring 1.4s ease-out both; }
      #coder[data-state="success"] .ln     { stroke: #fff4dc; opacity: 1; filter: url(#cGlow); animation: inkIn .6s ease-out both; }
      #coder[data-state="success"] .ln2    { animation-delay: .15s; }
      #coder[data-state="success"] .ln3    { animation-delay: .3s; }
      #coder[data-state="success"] .cursor { animation: none; opacity: 0; }
      #coder[data-state="success"] .check  { opacity: 1; animation: inkIn .6s ease-out .6s both; }

      /* ERROR – red tint, shake, brackets split, slash falls, a line glitches out */
      #coder[data-state="error"] { filter: hue-rotate(-38deg) saturate(2.4); }
      #coder[data-state="error"] .emblem { animation: shake .5s linear 3; }
      #coder[data-state="error"] .bl     { animation: splitL 1.6s var(--spring) both; }
      #coder[data-state="error"] .br     { animation: splitR 1.6s var(--spring) both; }
      #coder[data-state="error"] .sl     { animation: fall 1.6s var(--spring) both; }
      #coder[data-state="error"] .orbit  { animation: shake .4s linear 4; }
      #coder[data-state="error"] .trail  { opacity: .45; }
      #coder[data-state="error"] .core   { animation: errPulse .7s ease-in-out 3, dimCore 3s ease-in-out infinite 2.1s; }
      #coder[data-state="error"] .ln2    { animation: glitch 1.2s steps(1) 2 both; }
      #coder[data-state="error"] .ln3    { animation: inkErr 1.6s both; }
      #coder[data-state="error"] .cursor { animation-duration: .3s; }
      #coder[data-state="error"] .dot    { animation: blink .5s ease-in-out 4; }

      /* SLEEP – brackets slide together like closing eyes, caret blinks slowly */
      #coder[data-state="sleep"] { opacity: .5; }
      #coder[data-state="sleep"] .ring   { animation: spin 200s linear infinite; }
      #coder[data-state="sleep"] .orbit  { animation: spin 140s linear infinite; }
      #coder[data-state="sleep"] .trail  { opacity: .3; }
      #coder[data-state="sleep"] .core   { animation: breathe 7s ease-in-out infinite; }
      #coder[data-state="sleep"] .bl     { animation: sleepL 2s var(--spring) both; }
      #coder[data-state="sleep"] .br     { animation: sleepR 2s var(--spring) both; }
      #coder[data-state="sleep"] .sl     { opacity: .5; }
      #coder[data-state="sleep"] .ln     { opacity: .15; }
      #coder[data-state="sleep"] .cursor { animation-duration: 2.6s; }
      #coder[data-state="sleep"] .spark  { animation-duration: 7s; }
      #coder[data-state="sleep"] .dot    { opacity: .3; }

      @keyframes spin { to { rotate: 360deg; } }
      @keyframes twinkle { 0%,100%{opacity:.2;scale:.6} 50%{opacity:1;scale:1.4} }
      @keyframes blink { 0%,100%{opacity:.35;scale:.8} 30%{opacity:1;scale:1.25} 60%{opacity:.5;scale:.9} }
      @keyframes breathe { 0%,100%{scale:.92;opacity:.5} 50%{scale:1.08;opacity:1} }
      @keyframes pulse { 0%,100%{scale:.8;opacity:.45} 50%{scale:1.3;opacity:1} }
      @keyframes floatY { 0%,100%{translate:0 0} 50%{translate:0 -7px} }
      @keyframes caret { 0%{opacity:1} 50%{opacity:0} }
      @keyframes shimmer { 0%,100%{opacity:.25} 50%{opacity:.85} }

      @keyframes idleL { 0%{translate:0 0;animation-timing-function:var(--spring)} 25%{translate:-5px 0;animation-timing-function:var(--spring)} 50%{translate:3px 0;animation-timing-function:var(--spring)} 75%{translate:-2px 0;animation-timing-function:var(--spring)} 100%{translate:0 0} }
      @keyframes idleR { 0%{translate:0 0;animation-timing-function:var(--spring)} 25%{translate:5px 0;animation-timing-function:var(--spring)} 50%{translate:-3px 0;animation-timing-function:var(--spring)} 75%{translate:2px 0;animation-timing-function:var(--spring)} 100%{translate:0 0} }
      @keyframes idleS { 0%{rotate:0deg;animation-timing-function:var(--spring)} 25%{rotate:5deg;animation-timing-function:var(--spring)} 50%{rotate:-4deg;animation-timing-function:var(--spring)} 75%{rotate:2deg;animation-timing-function:var(--spring)} 100%{rotate:0deg} }

      @keyframes squeezeL { 0%{translate:0 0;animation-timing-function:var(--spring)} 30%{translate:16px 0;animation-timing-function:var(--spring)} 60%{translate:-7px 0;animation-timing-function:var(--spring)} 100%{translate:0 0} }
      @keyframes squeezeR { 0%{translate:0 0;animation-timing-function:var(--spring)} 30%{translate:-16px 0;animation-timing-function:var(--spring)} 60%{translate:7px 0;animation-timing-function:var(--spring)} 100%{translate:0 0} }
      @keyframes swing { 0%{rotate:0deg;animation-timing-function:var(--spring)} 30%{rotate:-18deg;animation-timing-function:var(--spring)} 60%{rotate:12deg;animation-timing-function:var(--spring)} 100%{rotate:0deg} }

      @keyframes inkA { 0%{stroke-dashoffset:100;opacity:.9} 20%{stroke-dashoffset:0} 92%{stroke-dashoffset:0;opacity:.9} 100%{stroke-dashoffset:0;opacity:0} }
      @keyframes inkB { 0%,28%{stroke-dashoffset:100;opacity:.9} 48%{stroke-dashoffset:0} 92%{stroke-dashoffset:0;opacity:.9} 100%{stroke-dashoffset:0;opacity:0} }
      @keyframes inkC { 0%,56%{stroke-dashoffset:100;opacity:.9} 76%{stroke-dashoffset:0} 92%{stroke-dashoffset:0;opacity:.9} 100%{stroke-dashoffset:0;opacity:0} }
      @keyframes type {
        0%{translate:-86px -52px;opacity:1;animation-timing-function:linear}
        20%{translate:24px -52px;animation-timing-function:var(--spring)}
        28%{translate:-62px -26px;animation-timing-function:linear}
        48%{translate:78px -26px;animation-timing-function:var(--spring)}
        56%{translate:-86px 0;animation-timing-function:linear}
        76%{translate:0 0;opacity:1}
        92%{translate:0 0;opacity:1}
        100%{translate:0 0;opacity:0}
      }
      @keyframes bump {
        0%{scale:1;animation-timing-function:ease-in} 19.5%{scale:.97}
        20%{scale:1.09;animation-timing-function:var(--spring)} 44%{scale:1;animation-timing-function:ease-in}
        47.5%{scale:.97} 48%{scale:1.09;animation-timing-function:var(--spring)} 72%{scale:1;animation-timing-function:ease-in}
        75.5%{scale:.97} 76%{scale:1.09;animation-timing-function:var(--spring)} 100%{scale:1}
      }

      @keyframes closeL { 0%{translate:-34px 0;scale:.8} 100%{translate:0 0;scale:1} }
      @keyframes closeR { 0%{translate:34px 0;scale:.8} 100%{translate:0 0;scale:1} }
      @keyframes closeS { 0%{rotate:-28deg;scale:.6} 100%{rotate:0deg;scale:1} }
      @keyframes whip { 0%{rotate:0deg} 100%{rotate:360deg} }
      @keyframes flash { 0%{scale:.8;opacity:.6} 30%{scale:2.6;opacity:1} 100%{scale:1;opacity:.85} }
      @keyframes ring { 0%{opacity:.9;scale:.2} 100%{opacity:0;scale:4} }
      @keyframes inkIn { 0%{stroke-dashoffset:100} 100%{stroke-dashoffset:0} }

      @keyframes shake { 0%,100%{translate:0} 25%{translate:-8px} 75%{translate:8px} }
      @keyframes splitL { 0%{translate:0 0;rotate:0deg} 100%{translate:-20px 0;rotate:-9deg} }
      @keyframes splitR { 0%{translate:0 0;rotate:0deg} 100%{translate:20px 0;rotate:9deg} }
      @keyframes fall { 0%{translate:0 0;rotate:0deg} 100%{translate:16px 38px;rotate:40deg} }
      @keyframes errPulse { 0%,100%{scale:.9;opacity:.4} 50%{scale:1.15;opacity:1} }
      @keyframes dimCore { 0%,100%{opacity:.35;scale:.9} 50%{opacity:.6;scale:.97} }
      @keyframes glitch { 0%{opacity:.5} 20%{opacity:.1} 40%{opacity:.6;translate:6px 0} 60%{opacity:.1} 80%{opacity:.5;translate:-5px 0} 100%{opacity:.25;translate:0 0} }
      @keyframes inkErr { 0%{stroke-dashoffset:100;opacity:.9} 45%{stroke-dashoffset:45;opacity:.9} 50%{opacity:.15} 55%{opacity:.9} 60%{opacity:.15} 100%{stroke-dashoffset:45;opacity:.4} }

      @keyframes sleepL { 0%{translate:0 0} 100%{translate:18px 0} }
      @keyframes sleepR { 0%{translate:0 0} 100%{translate:-18px 0} }

      @media (prefers-reduced-motion: reduce) { #coder * { animation: none !important; } }
    </style>

    <!-- outer dotted ring -->
    <circle class="ring" cx="256" cy="256" r="205" fill="none" stroke="#e6d5b3" stroke-opacity=".28" stroke-width="1.2" stroke-dasharray="2 8"></circle>

    <!-- orbit with comet trails: 3 comets properly spaced 120 degrees apart -->
    <g class="orbit">
      <!-- Comet 1 (top, 12 o'clock) -->
      <g>
        <path class="trail" d="M138.4 88.1 A205 205 0 0 1 256 51" fill="none" stroke="url(#cTail)" stroke-width="4" stroke-linecap="round"></path>
        <circle class="spark fx" cx="256" cy="51" r="6" fill="#fff4dc" filter="url(#cGlow)"></circle>
      </g>
      <!-- Comet 2 (120 degrees, 4 o'clock) -->
      <g transform="rotate(120 256 256)">
        <path class="trail" d="M138.4 88.1 A205 205 0 0 1 256 51" fill="none" stroke="url(#cTail)" stroke-width="3.5" stroke-linecap="round"></path>
        <circle class="spark fx" cx="256" cy="51" r="4.5" fill="#e8d9bd" style="animation-delay:1s"></circle>
      </g>
      <!-- Comet 3 (240 degrees, 8 o'clock) -->
      <g transform="rotate(240 256 256)">
        <path class="trail" d="M138.4 88.1 A205 205 0 0 1 256 51" fill="none" stroke="url(#cTail)" stroke-width="3.8" stroke-linecap="round"></path>
        <circle class="spark fx" cx="256" cy="51" r="5" fill="#fff4dc" style="animation-delay:2s"></circle>
      </g>
    </g>

    <circle class="burst" cx="256" cy="256" r="50" fill="none" stroke="#ffe9c2" stroke-width="3"></circle>
    <circle class="core" cx="256" cy="256" r="120" fill="url(#cCore)"></circle>

    <!-- emblem: < / > -->
    <g class="emblem" filter="url(#cGlow)" fill="none" stroke="url(#cGold)" stroke-linecap="round" stroke-linejoin="round">
      <path class="bl fx" d="M206 170 L146 230 L206 290" stroke-width="14"></path>
      <path class="br fx" d="M306 170 L366 230 L306 290" stroke-width="14"></path>
      <path class="sl fx" d="M272 158 L240 302" stroke-width="10"></path>
    </g>

    <!-- code lines, caret, success check -->
    <g fill="none" stroke="#e8d9bd" stroke-linecap="round">
      <path class="ln ln1" pathLength="100" d="M176 336 H286" stroke-width="6"></path>
      <path class="ln ln2" pathLength="100" d="M200 362 H340" stroke-width="6"></path>
      <path class="ln ln3" pathLength="100" d="M176 388 H262" stroke-width="6"></path>
      <path class="check" pathLength="100" d="M292 388 l10 10 l22 -24" stroke="#fff4dc" stroke-width="5" stroke-linejoin="round" filter="url(#cGlow)"></path>
    </g>
    <rect class="cursor" x="266" y="378" width="10" height="20" rx="2" fill="#fff4dc" filter="url(#cGlow)"></rect>

    <!-- celestial dots -->
    <g fill="#f6ead2" filter="url(#cGlow)">
      <circle class="dot fx" cx="256" cy="82" r="5" style="animation-delay:0s"></circle>
      <circle class="dot fx" cx="256" cy="108" r="3" style="animation-delay:.15s"></circle>
      <circle class="dot fx" cx="256" cy="436" r="3" style="animation-delay:.3s"></circle>
      <circle class="dot fx" cx="256" cy="458" r="5" style="animation-delay:.45s"></circle>
    </g>
  </svg>
